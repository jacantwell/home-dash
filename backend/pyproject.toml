[project]
name = "home-dash-api"
version = "0.1.0"
description = "home-dash backend: Clerk-authed messages API backed by Neon, forwarded to the ledboard"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "pyjwt[crypto]>=2.9",
  "psycopg[binary]>=3.2",
  "httpx>=0.27",
  "alembic>=1.19.2",
]

[dependency-groups]
dev = [
  "uvicorn>=0.30",
  "pytest>=8",
  "respx>=0.21",
  "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header"]

[tool.pytest.ini_options]
testpaths = ["tests"]
