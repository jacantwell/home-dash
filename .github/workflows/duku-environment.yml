# Records every commit that ships to production as a Duku build, labelled with
# the app version, then explores + tests it. On push the action also links the
# PR preview builds to the commit they landed as.
#
# Production is the `production` branch, not `main` — `main` deploys to staging
# and only reaches here once `promote-to-production.yml` fast-forwards it.
#
# Dispatch-only on purpose. `promote-to-production.yml` moves `production` with
# the GITHUB_TOKEN, and pushes made with that token do not trigger workflows, so
# a `push:` trigger here would silently never fire. Promote dispatches us
# instead, handing over the exact commit it shipped.
name: Duku production

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Commit to explore. Defaults to the tip of this ref.
        required: false

concurrency:
  group: duku-env-production
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read # resolve which PRs the pushed commits came from

jobs:
  explore:
    name: Duku production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha || github.sha }}

      - name: Read app version
        id: version
        # Fail loudly: an empty version would label the Duku release as a bare "v".
        run: |
          version="$(node -p "require('./web/package.json').version")"
          [ -n "$version" ] || { echo "::error::could not read version from web/package.json"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Wait for Vercel production deployment
        id: vercel
        uses: ./.github/actions/wait-for-vercel
        with:
          sha: ${{ inputs.sha || github.sha }}
          environment: Production

      - name: Explore production with Duku
        id: duku
        # Unreleased (0.4-to-be) code, pinned to duku-ai/actions main @ chrome-worker@7403cf1.
        # Move to a release tag (environment/vX.Y.Z) once one is cut. Dependabot is told to leave this alone.
        uses: duku-ai/actions/environment@c3fecd5985c82f36a56ecf8f6ceabfcd54fe3da2
        with:
          api-key: ${{ secrets.PLATFORM_API_KEY }}
          product-id: ${{ vars.DUKU_PRODUCT_ID }}
          api-url: ${{ vars.DUKU_API_URL || 'https://platform.duku.ai/graphql' }}
          # Must match the environment declared on the product in Viewport — the
          # production environment there is named `default`.
          environment: default
          # Same value the app reports as NEXT_PUBLIC_APP_VERSION.
          release-label: v${{ steps.version.outputs.version }}
          github-token: ${{ github.token }}

      - name: Summary
        if: always()
        env:
          URL: ${{ steps.vercel.outputs.url }}
          VERSION: ${{ steps.version.outputs.version }}
          RUN_ID: ${{ steps.duku.outputs.run-id }}
          RUN_STATUS: ${{ steps.duku.outputs.run-status }}
          TEST_ID: ${{ steps.duku.outputs.test-run-id }}
          TEST_STATUS: ${{ steps.duku.outputs.test-run-status }}
        run: |
          {
            echo "## Duku production — v$VERSION"
            echo
            echo "- **Deployed:** $URL"
            echo "- **Exploration:** ${RUN_ID:-none} (${RUN_STATUS:-not started})"
            echo "- **Tests:** ${TEST_ID:-none} (${TEST_STATUS:-not started})"
          } >> "$GITHUB_STEP_SUMMARY"
