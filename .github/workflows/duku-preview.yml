# Explores every PR's Vercel preview with Duku. The action kicks off the
# exploration and exits; the Duku AI GitHub App posts results to the PR and
# manages the "Duku Exploration (<product>)" check run.
name: Duku preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: duku-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write # sticky PR comment
  deployments: read # preview URL resolution

jobs:
  explore:
    name: Duku preview
    # Version-bump PRs have nothing new to explore.
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/actions
          sparse-checkout-cone-mode: false

      - name: Wait for Vercel preview
        id: vercel
        uses: ./.github/actions/wait-for-vercel
        with:
          # Vercel deploys the head commit, not the PR merge commit.
          sha: ${{ github.event.pull_request.head.sha }}
          environment: Preview

      - name: Explore preview with Duku
        id: duku
        # Unreleased (0.4-to-be) code, pinned to duku-ai/actions main @ chrome-worker@40cbc46.
        # Move to a release tag (preview/vX.Y.Z) once one is cut. Dependabot is told to leave this alone.
        uses: duku-ai/actions/preview@fc380ec6b7b367a6866808a4474463a48250dde6
        with:
          api-key: ${{ secrets.PLATFORM_API_KEY }}
          product-id: ${{ vars.DUKU_PRODUCT_ID }}
          api-url: ${{ vars.DUKU_API_URL || 'https://platform.duku.ai/graphql' }}
          exploration-url: ${{ steps.vercel.outputs.url }}
          vercel-automation-bypass-secret: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          github-token: ${{ github.token }}

      - name: Summary
        if: always()
        env:
          URL: ${{ steps.vercel.outputs.url }}
          RUN_ID: ${{ steps.duku.outputs.run-id }}
          RUN_STATUS: ${{ steps.duku.outputs.run-status }}
          TARGET: ${{ steps.duku.outputs.target-name }}
        run: |
          {
            echo "## Duku preview"
            echo
            echo "- **Preview:** $URL"
            echo "- **Build:** $TARGET"
            echo "- **Exploration:** ${RUN_ID:-none} (${RUN_STATUS:-not started})"
          } >> "$GITHUB_STEP_SUMMARY"
