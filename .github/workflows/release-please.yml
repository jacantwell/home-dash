# Every merge to main cuts a version. release-please opens/updates the release
# PR and it merges itself once CI passes; that merge tags vX.Y.Z, publishes a
# GitHub Release, updates CHANGELOG.md + package.json, and is the only kind of
# `main` commit Vercel deploys to staging (vercel.json's ignoreCommand). So
# staging always runs a tagged version, and it's the one Duku staging explores.
#
# Merges with only hidden commit types (chore, refactor, docs, ci...) get no
# version and ship with the next feat/fix.
#
# Production is a separate button: promote-to-production.yml ships the same
# tagged version and publishes it to Duku's production environment.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release please
    runs-on: ubuntu-latest
    outputs:
      release-created: ${{ steps.release.outputs.web--release_created }}
      tag: ${{ steps.release.outputs.web--tag_name }}
      pr: ${{ steps.release.outputs.pr }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          # PAT so the release PR triggers required CI checks (GITHUB_TOKEN-authored PRs don't).
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Queued with the PAT, not GITHUB_TOKEN: the merge's push has to start this
  # workflow again so release-please can tag it.
  auto-merge:
    name: Auto-merge release PR
    needs: release-please
    if: needs.release-please.outputs.pr != '' && needs.release-please.outputs.release-created != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Merge once CI passes
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          NUMBER: ${{ fromJSON(needs.release-please.outputs.pr).number }}
          TITLE: ${{ fromJSON(needs.release-please.outputs.pr).title }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::RELEASE_PLEASE_TOKEN is not set; a GITHUB_TOKEN merge would never get tagged"
            exit 1
          fi
          gh pr merge "$NUMBER" --repo "$GITHUB_REPOSITORY" --auto --squash --subject "$TITLE (#$NUMBER)"

  # Only fires on the push that merged a release PR, which is also the only
  # `main` commit staging deploys, so Duku only ever sees tagged versions.
  duku-staging:
    name: Duku staging
    needs: release-please
    if: needs.release-please.outputs.release-created == 'true'
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/duku-environment.yml
    with:
      environment: staging
      sha: ${{ github.sha }}
      release-label: ${{ needs.release-please.outputs.tag }}
    secrets: inherit
